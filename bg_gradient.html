<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 이벤트</title>
    <style> 
    .a{
        width: 300px;
        height: 200px;
        background: linear-gradient(-90deg, gold 0%, blue 50% , tomato 100%);
    }
    .b{
        width: 300px;
        height: 300px;
        background: linear-gradient(90deg, gold 0% 33% , blue 33% 70% , red 70% 100% );
    }
    .c{
        width: 300px;
        height: 300px;
        background: linear-gradient(217deg, red, transparent 70% ), 
                linear-gradient(127deg, rgb(251, 255, 0), transparent 70% ), 
                linear-gradient(336deg, rgb(0, 60, 255), transparent 70% );
    }
    .d{
        width: 300px;
        height: 300px;
        
    }
    </style>
</head>
<body>
    <div class="a"> </div>
    <div class="b"> </div>
    <div class="c"> </div>
    <div class="d"> </div>
    <div class="e"> </div>
</body>
</html>
